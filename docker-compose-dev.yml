# Budgeteer Dev Stack — HTTPS via Angie (nginx-compatible reverse proxy)
#
# Standalone compose file: replaces the base docker-compose.yml for local
# development with HTTPS support (required for Web Crypto API).
#
# Usage:
#   ./gen_certs.sh 10.23.12.2     # generate certs with your dev machine IP
#   docker compose -f docker-compose-dev.yml up -d
#
# The app will be available at:
#   https://<your-dev-ip>         (HTTPS, recommended)
#   http://<your-dev-ip>:8080     (backend API directly, no auth needed)

services:
  # ── HTTPS Reverse Proxy (Angie / nginx) ────────────────
  https-proxy:
    image: nginx:alpine
    ports:
      - "8443:443"
    volumes:
      - ./angie-dev.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/certs:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

  # ── Frontend (internal only) ───────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_BUDGETEER_DEBUG_CONSOLE: "1"
    develop:
      watch:
        - action: rebuild
          path: ./frontend
    expose:
      - "80"
    depends_on:
      - backend
    restart: unless-stopped

  # ── Backend ────────────────────────────────────────────
  backend:
    build:
      context: ./backend/src
      dockerfile: Dockerfile
    develop:
      watch:
        - action: rebuild
          path: ./backend
    secrets:
      - jwt_secret
      - db_password
      - smtp_password
      - redis_password
      - server_encryption_key
    environment:
      - DB_HOST=postgres
      - DB_USER=budgeteer
      - DB_NAME=budgeteer
      - REDIS_HOST=redis
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_FROM=${SMTP_FROM:-}
      - SMTP_SSL=${SMTP_SSL:-false}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - RULES_CHECK_INTERVAL=${RULES_CHECK_INTERVAL:-10}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  # ── PostgreSQL (TimescaleDB) ───────────────────────────
  postgres:
    image: timescale/timescaledb:2.28.1-pg18
    secrets:
      - db_password
    environment:
      - POSTGRES_USER=budgeteer
      - POSTGRES_DB=budgeteer
      - POSTGRES_PASSWORD_FILE=/run/secrets/db_password
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql
      - ./backend/src/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U budgeteer"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── pgAdmin ────────────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      - PGADMIN_DEFAULT_EMAIL=pgadmin4@pgadmin.org
      - PGADMIN_DEFAULT_PASSWORD=admin
      - PGADMIN_CONFIG_SERVER_MODE=False
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./pgadmin_data:/var/lib/pgadmin
    restart: unless-stopped

  # ── Redis ──────────────────────────────────────────────
  redis:
    image: redis:latest
    secrets:
      - redis_password
    command: >
      sh -c 'redis-server --requirepass "$$(cat /run/secrets/redis_password)"'
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

secrets:
  jwt_secret:
    file: ./secrets/jwt_secret.txt
  db_password:
    file: ./secrets/db_password.txt
  smtp_password:
    file: ./secrets/smtp_password.txt
  redis_password:
    file: ./secrets/redis_password.txt
  server_encryption_key:
    file: ./secrets/server_encryption_key.txt

volumes:
  pg_data:
    driver: local
  redis_data:
    driver: local
  pgadmin_data:
    driver: local
